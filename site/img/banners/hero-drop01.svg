<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 750" width="1920" height="750">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="40%" stop-color="#121217" />
      <stop offset="80%" stop-color="#180e10" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <radialGradient id="eclipseGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c92a2a" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#8b1e1e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridLarge" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <rect width="1920" height="750" fill="url(#bannerBg)" />
  <rect width="1920" height="750" fill="url(#gridLarge)" />

  <!-- Eclipse Circle & Aura -->
  <circle cx="960" cy="300" r="280" fill="url(#eclipseGlow)" />
  <circle cx="960" cy="300" r="160" fill="#070709" stroke="#c92a2a" stroke-width="3" stroke-dasharray="12,6" />
  <circle cx="960" cy="300" r="150" fill="#040405" stroke="#c5a059" stroke-width="1.5" />

  <!-- Dark Sun Ray lines / Geometry -->
  <path d="M 660 300 L 1260 300" stroke="#8b1e1e" stroke-width="1" stroke-opacity="0.5" />
  <path d="M 960 100 L 960 500" stroke="#8b1e1e" stroke-width="1" stroke-opacity="0.5" />
  <path d="M 750 150 L 1170 450" stroke="#c5a059" stroke-width="0.8" stroke-opacity="0.4" />
  <path d="M 750 450 L 1170 150" stroke="#c5a059" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Text & Typography -->
  <g transform="translate(960, 230)">
    <!-- Drop Tag -->
    <rect x="-140" y="-30" width="280" height="34" fill="#8b1e1e" fill-opacity="0.85" rx="2" />
    <text x="0" y="-8" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="5">LANÇAMENTO ATIVO DO MÊS</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="'Cinzel', serif" font-weight="800" font-size="64" fill="#f5f3ee" text-anchor="middle" letter-spacing="8">AS MASMORRAS DE MA'HABRE</text>
    
    <!-- Subtitle -->
    <text x="0" y="130" font-family="'Inter', sans-serif" font-size="18" fill="#b5b3aa" text-anchor="middle" letter-spacing="3">DROP 01 • COLEÇÃO LIMITADA DE VESTUÁRIO OBSIDIANA</text>
    
    <!-- Lore Quote -->
    <text x="0" y="175" font-family="'Cinzel', serif" font-style="italic" font-size="14" fill="#c5a059" text-anchor="middle" letter-spacing="2">"Na escuridão mais profunda, a fome é o único deus que não mente."</text>
  </g>

  <!-- Frame corners -->
  <rect x="30" y="30" width="1860" height="690" fill="none" stroke="#252530" stroke-width="1.5" />
  <path d="M 30 80 L 80 30 M 30 30 L 100 30 M 30 30 L 30 100" stroke="#8b1e1e" stroke-width="2.5" fill="none" />
  <path d="M 1890 80 L 1840 30 M 1890 30 L 1820 30 M 1890 30 L 1890 100" stroke="#8b1e1e" stroke-width="2.5" fill="none" />
</svg>